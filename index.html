<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Phil Chat Times — Archive</title>
    <meta
      name="description"
      content="Every edition of The Phil Chat Times, readable in full."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <header class="nameplate wrap">
      <hr class="nameplate__rule" />
      <h1 class="nameplate__title">The Phil Chat Times</h1>
      <p class="nameplate__motto">All the philosophy conversations fit to print</p>
      <hr class="nameplate__rule nameplate__rule--under" />
      <div class="dateline">
        <span id="dateline-run">The Complete Archive</span>
        <span id="dateline-count"></span>
      </div>
    </header>

    <main class="wrap">
      <div class="section-head"><h2>Past Editions</h2></div>
      <ul class="grid" id="grid">
        <li class="notice" id="loading">Fetching the archive…</li>
      </ul>
    </main>

    <footer class="site-foot wrap">
      <span>The Phil Chat Times — an X-Effort production</span>
      <span
        >Read in-browser. Nothing is uploaded; every edition is served as a
        static file.</span
      >
    </footer>

    <script src="assets/js/library.js"></script>
  </body>
</html>
